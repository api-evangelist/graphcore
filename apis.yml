name: Graphcore
description: >-
  Graphcore is a semiconductor and AI-computing company that designs the Intelligence
  Processing Unit (IPU), a processor purpose-built for machine intelligence workloads,
  along with the IPU-Machine, IPU-POD and Bow systems that scale it. Its developer
  surface is the Poplar SDK software stack -- Poplar, PopART (Poplar Advanced Runtime),
  PopTorch (a PyTorch interface for the IPU) and PopLibs -- distributed as open-source
  components on GitHub and as prebuilt wheels in the Poplar SDK download. Graphcore
  targets training and inference for deep-learning models and integrates with standard
  frameworks such as PyTorch, TensorFlow and ONNX. Founded in Bristol, UK, Graphcore
  became part of SoftBank Group in 2024. It exposes no public REST API; this profile
  catalogs its software developer surface. Surfaced originally as a portfolio company
  of Atomico, Balderton Capital and DCVC and enriched by the API Evangelist pipeline.
